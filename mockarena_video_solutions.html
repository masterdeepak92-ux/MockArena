<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Video Solutions — MockArena</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Crimson+Pro:wght@400;600;700&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --cream:#faf9f5;--cw:#f4f2eb;
  --forest:#1a2618;--forest-s:#243422;
  --border:rgba(26,38,24,.08);--bm:rgba(26,38,24,.13);
  --t1:#1a2618;--t2:#2e3a2a;--t3:#5a6654;--t4:#9aaa94;
  --ff:'Outfit',sans-serif;--fs:'Crimson Pro',Georgia,serif;
  --r:16px;--tf:.2s ease;
  --sh:0 8px 32px rgba(26,38,24,.1);--sh-lg:0 20px 56px rgba(26,38,24,.14);
}
html{font-size:17px;-webkit-text-size-adjust:100%;}
body{font-family:var(--ff);background:var(--cream);color:var(--t1);min-height:100vh;display:flex;flex-direction:column;}

/* ── TOPBAR ── */
.topbar{background:rgba(250,249,245,.97);backdrop-filter:blur(20px);border-bottom:1.5px solid var(--border);height:60px;display:flex;align-items:center;padding:0 24px;gap:10px;flex-shrink:0;}
.tb-logo{font-size:1.2rem;font-weight:900;color:var(--forest);letter-spacing:-.03em;text-decoration:none;}
.tb-logo em{color:#2d6b1a;font-style:normal;}
.tb-sep{flex:1;}
.tb-link{padding:7px 13px;border-radius:9px;font-size:.95rem;font-weight:600;color:var(--t3);text-decoration:none;transition:all var(--tf);}
.tb-link:hover{color:var(--forest);background:rgba(26,38,24,.05);}
.tb-btn{padding:8px 18px;border-radius:9px;border:1.5px solid var(--bm);font-family:var(--ff);font-size:.95rem;font-weight:700;color:var(--t2);text-decoration:none;transition:all var(--tf);}
.tb-btn:hover{border-color:var(--forest);color:var(--forest);}
.tb-btn.pri{background:var(--forest);border-color:var(--forest);color:#fff;}
.tb-btn.pri:hover{background:#2d6b1a;}

/* ── MAIN ── */
.main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:52px 24px 64px;}

/* ── HEADER ── */
.hd{text-align:center;margin-bottom:40px;}
.hd-label{display:inline-flex;align-items:center;gap:7px;background:rgba(45,107,26,.08);border:1.5px solid rgba(45,107,26,.18);border-radius:100px;padding:5px 14px;font-size:.9rem;font-weight:700;color:#2d6b1a;margin-bottom:16px;}
.hd-title{font-family:var(--fs);font-size:2.2rem;font-weight:700;color:var(--forest);letter-spacing:-.02em;line-height:1.18;margin-bottom:10px;}
.hd-sub{font-size:.98rem;color:var(--t4);font-weight:500;}

/* ── CARDS ── */
.cards{display:grid;grid-template-columns:1fr 1fr;gap:20px;width:100%;max-width:720px;}
.card{background:#fff;border:2px solid var(--border);border-radius:var(--r);overflow:hidden;text-decoration:none;display:flex;flex-direction:column;transition:all var(--tf);}
.card:hover{transform:translateY(-5px);box-shadow:var(--sh-lg);border-color:transparent;}

/* top strip */
.card-strip-top{height:6px;width:100%;}
.c-pyq .card-strip-top{background:linear-gradient(90deg,#1a2618,#3d5239);}
.c-ncert .card-strip-top{background:linear-gradient(90deg,#1a3a5c,#2563eb);}

/* card body */
.card-body{padding:28px 26px 24px;flex:1;}
.card-icon{font-size:2.6rem;margin-bottom:14px;display:block;line-height:1;}
.card-title{font-family:var(--fs);font-size:1.5rem;font-weight:700;color:var(--forest);line-height:1.2;margin-bottom:8px;letter-spacing:-.015em;}
.card-info{font-size:.94rem;color:var(--t3);font-weight:500;line-height:1.6;}

/* bottom CTA strip */
.card-foot{display:flex;align-items:center;justify-content:space-between;padding:13px 26px;flex-shrink:0;transition:background var(--tf);}
.c-pyq .card-foot{background:var(--forest);}
.c-ncert .card-foot{background:#1a3a5c;}
.c-pyq:hover .card-foot{background:#2d5a22;}
.c-ncert:hover .card-foot{background:#2563eb;}
.foot-txt{font-size:1rem;font-weight:800;color:#fff;letter-spacing:-.01em;}
.foot-arr{font-size:1.2rem;color:rgba(255,255,255,.75);transition:transform var(--tf);}
.card:hover .foot-arr{transform:translateX(5px);}

/* ── RESPONSIVE ── */
@media(max-width:700px){
  html{font-size:16px;}
  .main{padding:40px 18px 52px;}
  .cards{grid-template-columns:1fr;gap:16px;max-width:420px;}
  .hd-title{font-size:1.9rem;}
  .hd{margin-bottom:28px;}
  .card-body{padding:24px 22px 20px;}
  .card-foot{padding:12px 22px;}
  .card-icon{font-size:2.2rem;}
  .card-title{font-size:1.35rem;}
  .tb-link{display:none;}
}
@media(max-width:380px){
  html{font-size:15.5px;}
  .hd-title{font-size:1.7rem;}
  .card-body{padding:20px 18px 18px;}
  .card-foot{padding:12px 18px;}
  .topbar{padding:0 16px;}
}
</style>
</head>
<body>

<header class="topbar">
  <a href="index.html" class="tb-logo">Mock<em>Arena</em></a>
  <a href="index.html" class="tb-link">Home</a>
  <a href="mockarena_notes.html" class="tb-link">Notes</a>
  <div class="tb-sep"></div>
  <a href="mockarena_student_dashboard.html" class="tb-btn">Dashboard</a>
  <a href="mockarena_onboarding.html" class="tb-btn pri">Start Free →</a>
</header>

<main class="main">
  <div class="hd">
    <div class="hd-label">🎬 Video Solutions</div>
    <h1 class="hd-title">What do you want<br/>to watch?</h1>
    <p class="hd-sub">Tap to start watching</p>
  </div>

  <div class="cards">
    <a href="mockarena_solutions.html" class="card c-pyq">
      <div class="card-strip-top"></div>
      <div class="card-body">
        <span class="card-icon">📅</span>
        <div class="card-title">PYQ Solutions</div>
        <div class="card-info">NEET · JEE Main · JEE Advanced<br/>2016 – 2026 · All shifts &amp; sessions</div>
      </div>
      <div class="card-foot">
        <span class="foot-txt">Watch Now</span>
        <span class="foot-arr">→</span>
      </div>
    </a>

    <a href="mockarena_ncert.html" class="card c-ncert">
      <div class="card-strip-top"></div>
      <div class="card-body">
        <span class="card-icon">📚</span>
        <div class="card-title">NCERT Solutions</div>
        <div class="card-info">Class 9 · 10 · 11 · 12<br/>Textbook + Exemplar · All subjects</div>
      </div>
      <div class="card-foot">
        <span class="foot-txt">Watch Now</span>
        <span class="foot-arr">→</span>
      </div>
    </a>
  </div>
</main>

</body>
</html>
